services:
  app:
    # Production always runs a prebuilt image pulled from GHCR -- this file
    # alone (`docker compose -f docker-compose.yml ...`, exactly what
    # .github/workflows/deploy.yml's VPS step invokes) never builds
    # anything. RERAISE_IMAGE is exported by that deploy step to the
    # specific immutable SHA tag (or, during a rollback, the previous
    # image's id) it just verified; ${RERAISE_IMAGE:-...} falls back to
    # `latest` for a manual `docker compose up` outside the deploy script.
    #
    # Local development still gets `docker compose build`/`up --build` for
    # free: docker-compose.override.yml (auto-merged by plain `docker
    # compose` invocations with no `-f`) adds the `build:` section back.
    # The deploy script always passes `-f docker-compose.yml` explicitly,
    # so the override -- even though it's checked out on the VPS too, same
    # as everywhere else in this repo -- never applies there.
    image: ${RERAISE_IMAGE:-ghcr.io/isawyou/re-raise:latest}
    container_name: re-raise
    restart: unless-stopped
    ports:
      # Loopback-only by design, not a limitation: nginx on this same VPS
      # terminates TLS for re-raise.ru/www.re-raise.ru and reverse-proxies
      # `location /` straight to 127.0.0.1:3002 (see
      # /etc/nginx/sites-enabled/re-raise) -- this container IS production,
      # for both the re-raise.ru website and the Telegram Mini App (opened
      # from the bot's menu button, inside Telegram's WebView) -- there is
      # no separate live deployment. Corrected 2026-09: an earlier version
      # of this comment claimed a second, independent production deployment
      # on Vercel backed by Supabase; that was stale/incorrect and has been
      # removed -- see CLAUDE.md's Architecture section.
      - "127.0.0.1:3002:3000"
    volumes:
      # Uploaded avatars — bind mount (not a named volume) so the same host
      # path can also be read directly by nginx (see
      # /etc/nginx/sites-enabled/re-raise, location ^~ /storage/) for
      # efficient static serving, and so files survive `docker compose
      # build`/`down` since they live outside the container entirely. Same
      # pattern as poker-clock's ./storage:/app/public/storage.
      - ./storage:/app/public/storage
    environment:
      # Also available at runtime, not just baked into the client bundle at
      # build time (server components / API routes read these directly).
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_TELEGRAM_BOT_ID=${NEXT_PUBLIC_TELEGRAM_BOT_ID}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      # Server-only secrets — never exposed to the browser.
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SUPPORT_ADMIN_CHAT_ID=${SUPPORT_ADMIN_CHAT_ID}
      - SESSION_SECRET=${SESSION_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - GOOGLE_CLIENT_EMAIL=${GOOGLE_CLIENT_EMAIL}
      - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY}
      - GOOGLE_SHEETS_SPREADSHEET_ID=${GOOGLE_SHEETS_SPREADSHEET_ID}
      # Postgres is the only live production database -- DATABASE_PROVIDER
      # is "postgres" here, and this is the only production deployment
      # (there is no separate Supabase-backed deployment; SupabaseXxxRepository
      # implementations remaining in the codebase are legacy/compatibility
      # code, not a live target). DATABASE_URL resolves poker-clock-db
      # because of the `networks:` override below (same external-network
      # pattern docker-compose.postgres.yml already uses).
      - DATABASE_PROVIDER=${DATABASE_PROVIDER}
      - DATABASE_URL=${DATABASE_URL}
      # Poker Clock integration (app/api/integrations/v1/**, lib/integration-auth.ts)
      # -- a single static bearer token for that one machine caller, verified
      # constant-time. Not set here: this only declares the pass-through: the
      # actual value lives in the VPS host's own .env, set by hand the same
      # way every other secret in this file already is. Empty/unset means the
      # integration routes fail closed (401 on every request), not open.
      - POKER_CLOCK_INTEGRATION_TOKEN=${POKER_CLOCK_INTEGRATION_TOKEN}
      # Opposite direction (Re-Raise -> Poker Clock, home page LIVE card --
      # lib/poker-clock-client.ts, app/api/tournaments/live-state). Same
      # "empty means disabled, not open" convention as above; NOT the same
      # secret as POKER_CLOCK_INTEGRATION_TOKEN (see .env.example).
      - POKER_CLOCK_BASE_URL=${POKER_CLOCK_BASE_URL}
      - POKER_CLOCK_LIVE_STATE_TOKEN=${POKER_CLOCK_LIVE_STATE_TOKEN}
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    name: poker-clock_default
    external: true
