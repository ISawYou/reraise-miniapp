name: "Ops: Lee BOUNTY HUNTERS KO/rating one-row fix"

# One-time, narrowly-scoped incident correction -- NOT a general tool.
#
# Confirmed production state: BOUNTY HUNTERS (2026-09-10), Lee, place=1,
# knockouts=8, but rating_points is still 132 -- the addon-share bounty
# formula's output for knockouts=0 (172 is correct for 8). Every in-app
# write path to `results` was audited and ruled out (see the accompanying
# investigation) -- this can only be a stale row, not something the running
# application would reproduce or need to guard against generally. This
# workflow updates EXACTLY that one row's knockout_points/rating_points and
# nothing else: no other player, no other tournament, no formula/migration
# change, no app deploy.
#
# Delete this workflow file once the correction has been applied and
# verified -- it exists only to fix this one row.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: DRY_RUN performs zero writes. APPLY requires the exact confirmation phrase.
        required: true
        type: choice
        options:
          - DRY_RUN
          - APPLY
        default: DRY_RUN
      confirmation:
        description: For APPLY only, type FIX_LEE_BOUNTY_8 exactly. Ignored for DRY_RUN.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual request
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          case "$MODE" in
            DRY_RUN|APPLY) ;;
            *) echo "mode must be DRY_RUN or APPLY." >&2; exit 1 ;;
          esac
          if [ "$MODE" = "APPLY" ] && [ "$CONFIRMATION" != "FIX_LEE_BOUNTY_8" ]; then
            echo "Confirmation did not match FIX_LEE_BOUNTY_8. Production was not contacted." >&2
            exit 1
          fi

  fix:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ inputs.mode }}
    steps:
      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Read-only verify, then (APPLY only) apply the guarded one-row correction
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_SSH_PORT || 22 }}" \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            env FIX_MODE="$MODE" \
            bash -s <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          umask 077

          DB_CONTAINER=poker-clock-db
          DB_NAME=reraise
          DB_USER=reraise
          DOCKER_NETWORK=poker-clock_default
          MODE="${FIX_MODE:-DRY_RUN}"

          # Hardcoded to THIS incident on purpose -- not workflow inputs.
          # Making tournament/player identification a runtime parameter is
          # exactly the generic "recalculate any result" capability this
          # incident explicitly does not authorize.
          TOURNAMENT_TITLE='BOUNTY HUNTERS'
          TOURNAMENT_TYPE='bounty'
          TOURNAMENT_DATE_MSK='2026-09-10'
          RESULT_PLACE=1
          PLAYER_DISPLAY_NAME='Lee'

          section() {
            printf '\n================ %s ================\n' "$1"
          }

          fail() {
            echo "STOP: $*" >&2
            exit 1
          }

          require_healthy_container() {
            local container="$1"
            local status health
            docker inspect "$container" >/dev/null 2>&1 || fail "Required container '$container' was not found."
            status="$(docker inspect "$container" --format '{{.State.Status}}')"
            health="$(docker inspect "$container" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}')"
            [ "$status" = "running" ] && [ "$health" = "healthy" ] \
              || fail "Container '$container' is not healthy (status=$status, health=$health)."
          }

          psql_x() {
            docker exec -i "$DB_CONTAINER" \
              psql -X -q -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$DB_NAME" "$@"
          }

          section "PREFLIGHT"
          require_healthy_container "$DB_CONTAINER"
          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 \
            || fail "Docker network '$DOCKER_NETWORK' was not found."
          docker inspect "$DB_CONTAINER" --format '{{json .NetworkSettings.Networks}}' | grep -q "\"$DOCKER_NETWORK\"" \
            || fail "Container '$DB_CONTAINER' is not connected to '$DOCKER_NETWORK'."

          connected_target="$(psql_x -At <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT current_user || '|' || current_database();
          ROLLBACK;
          SQL
          )"
          [ "$connected_target" = "${DB_USER}|${DB_NAME}" ] \
            || fail "psql connected to an unexpected database or user."

          section "DISCOVER (read-only)"
          tournament_rows="$(psql_x -At <<SQL
          BEGIN TRANSACTION READ ONLY;
          SELECT id FROM tournaments
          WHERE title = '${TOURNAMENT_TITLE}'
            AND tournament_type = '${TOURNAMENT_TYPE}'
            AND (start_at AT TIME ZONE 'Europe/Moscow')::date = DATE '${TOURNAMENT_DATE_MSK}';
          ROLLBACK;
          SQL
          )"
          tournament_count="$(printf '%s\n' "$tournament_rows" | grep -c . || true)"
          [ "$tournament_count" -eq 1 ] \
            || fail "Expected exactly 1 matching tournament, found $tournament_count."
          TOURNAMENT_ID="$tournament_rows"
          echo "TOURNAMENT_ID=$TOURNAMENT_ID"

          result_row="$(psql_x -At -F'|' <<SQL
          BEGIN TRANSACTION READ ONLY;
          SELECT r.player_id, r.knockouts, r.rating_points, r.participation_points,
                 r.knockout_points, r.boss_bounty_points, r.mystery_bounty_points, r.itm_points
          FROM results r
          JOIN players p ON p.id = r.player_id
          WHERE r.tournament_id = '${TOURNAMENT_ID}'
            AND r.place = ${RESULT_PLACE}
            AND p.display_name = '${PLAYER_DISPLAY_NAME}';
          ROLLBACK;
          SQL
          )"
          result_count="$(printf '%s\n' "$result_row" | grep -c . || true)"
          [ "$result_count" -eq 1 ] \
            || fail "Expected exactly 1 matching result row (place=$RESULT_PLACE, display_name=$PLAYER_DISPLAY_NAME), found $result_count."

          IFS='|' read -r PLAYER_ID KNOCKOUTS RATING_POINTS PARTICIPATION_POINTS KNOCKOUT_POINTS BOSS_BOUNTY_POINTS MYSTERY_BOUNTY_POINTS ITM_POINTS <<EOF
          $result_row
          EOF

          echo "PLAYER_ID=$PLAYER_ID"
          echo "KNOCKOUTS=$KNOCKOUTS"
          echo "RATING_POINTS=$RATING_POINTS"
          echo "PARTICIPATION_POINTS=$PARTICIPATION_POINTS"
          echo "KNOCKOUT_POINTS=$KNOCKOUT_POINTS"
          echo "BOSS_BOUNTY_POINTS=$BOSS_BOUNTY_POINTS"
          echo "MYSTERY_BOUNTY_POINTS=$MYSTERY_BOUNTY_POINTS"
          echo "ITM_POINTS=$ITM_POINTS"

          for var_name in KNOCKOUTS RATING_POINTS PARTICIPATION_POINTS KNOCKOUT_POINTS BOSS_BOUNTY_POINTS MYSTERY_BOUNTY_POINTS ITM_POINTS; do
            [ -n "${!var_name}" ] || fail "$var_name is NULL/empty (unbackfilled row) -- refusing to proceed."
          done

          computed_total=$((PARTICIPATION_POINTS + KNOCKOUT_POINTS + BOSS_BOUNTY_POINTS + MYSTERY_BOUNTY_POINTS + ITM_POINTS))
          [ "$computed_total" -eq "$RATING_POINTS" ] \
            || fail "Breakdown does not sum to rating_points before update ($computed_total != $RATING_POINTS)."
          echo "BREAKDOWN_BEFORE_VALID=YES ($PARTICIPATION_POINTS + $KNOCKOUT_POINTS + $BOSS_BOUNTY_POINTS + $MYSTERY_BOUNTY_POINTS + $ITM_POINTS = $RATING_POINTS)"

          if [ "$KNOCKOUTS" = "8" ] && [ "$RATING_POINTS" = "132" ] && [ "$KNOCKOUT_POINTS" = "0" ]; then
            echo "DRY_RUN_MATCHED_EXPECTATION=YES"
          else
            echo "DRY_RUN_MATCHED_EXPECTATION=NO"
          fi

          if [ "$MODE" = "DRY_RUN" ]; then
            section "DRY_RUN complete -- zero writes performed."
            exit 0
          fi

          section "APPLY"
          [ "$KNOCKOUTS" = "8" ] && [ "$RATING_POINTS" = "132" ] && [ "$KNOCKOUT_POINTS" = "0" ] \
            || fail "Current state does not match the expected bad state (knockouts=8, rating_points=132, knockout_points=0) -- refusing to write."

          field_count_before="$(psql_x -At <<SQL
          BEGIN TRANSACTION READ ONLY;
          SELECT count(*) FROM results WHERE tournament_id = '${TOURNAMENT_ID}';
          ROLLBACK;
          SQL
          )"

          apply_output="$(psql_x -At <<SQL
          BEGIN;

          DO \$\$
          DECLARE
            v_count integer;
            v_participation integer;
            v_knockout integer;
            v_boss integer;
            v_mystery integer;
            v_itm integer;
            v_rating integer;
            v_knockouts integer;
          BEGIN
            UPDATE results
            SET knockout_points = 40,
                rating_points = 172
            WHERE tournament_id = '${TOURNAMENT_ID}'
              AND player_id = '${PLAYER_ID}'
              AND place = ${RESULT_PLACE}
              AND knockouts = 8
              AND knockout_points = 0
              AND rating_points = 132;

            GET DIAGNOSTICS v_count = ROW_COUNT;
            IF v_count <> 1 THEN
              RAISE EXCEPTION 'guard failed: expected exactly 1 row updated, got %', v_count;
            END IF;

            SELECT knockouts, participation_points, knockout_points, boss_bounty_points,
                   mystery_bounty_points, itm_points, rating_points
            INTO v_knockouts, v_participation, v_knockout, v_boss, v_mystery, v_itm, v_rating
            FROM results
            WHERE tournament_id = '${TOURNAMENT_ID}' AND player_id = '${PLAYER_ID}';

            IF v_knockouts <> 8 THEN
              RAISE EXCEPTION 'guard failed: knockouts changed to %, expected 8', v_knockouts;
            END IF;
            IF v_knockout <> 40 THEN
              RAISE EXCEPTION 'guard failed: knockout_points is %, expected 40', v_knockout;
            END IF;
            IF v_rating <> 172 THEN
              RAISE EXCEPTION 'guard failed: rating_points is %, expected 172', v_rating;
            END IF;
            IF (v_participation + v_knockout + v_boss + v_mystery + v_itm) <> v_rating THEN
              RAISE EXCEPTION 'guard failed: breakdown does not sum to rating_points after update';
            END IF;
          END
          \$\$;

          SELECT knockouts, rating_points, participation_points, knockout_points,
                 boss_bounty_points, mystery_bounty_points, itm_points
          FROM results
          WHERE tournament_id = '${TOURNAMENT_ID}' AND player_id = '${PLAYER_ID}';

          COMMIT;
          SQL
          )"

          field_count_after="$(psql_x -At <<SQL
          BEGIN TRANSACTION READ ONLY;
          SELECT count(*) FROM results WHERE tournament_id = '${TOURNAMENT_ID}';
          ROLLBACK;
          SQL
          )"
          [ "$field_count_before" = "$field_count_after" ] \
            || fail "Result row count for this tournament changed ($field_count_before -> $field_count_after) -- this must never happen for a single-field UPDATE."

          echo "AFFECTED_ROWS=1"
          echo "$apply_output"
          section "APPLY complete and committed."
          REMOTE_SCRIPT
