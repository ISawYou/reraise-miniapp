name: "Ops: CRAZY PINEAPPLE (2026-09-13) diagnostic (read-only)"

# One-time, read-only production diagnostic -- NOT a general tool, performs
# ZERO writes anywhere (every query wrapped in
# BEGIN TRANSACTION READ ONLY; ... ROLLBACK;). Exists to establish, from
# actual production rows, why the live (non-completed) CRAZY PINEAPPLE
# tournament dated 2026-09-13 (Moscow) currently shows 19 registered
# players with one participant ("TO_OXIN") active/"В игре" while a
# visually-similar "TOXIN" is already eliminated around place 8 -- the
# operator's business claim is that these are the same real person and the
# active TO_OXIN row is an erroneous duplicate participation in THIS
# tournament -- plus a stale-looking "20 место" placement gap against a
# 19-player field. Hardcoded to this exact incident (title + Moscow date +
# nickname patterns), not a generic query tool.
#
# Delete this workflow file once the investigation concludes.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Read-only diagnostic for CRAZY PINEAPPLE 2026-09-13
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_SSH_PORT || 22 }}" \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          umask 077

          DB_CONTAINER=poker-clock-db
          DB_NAME=reraise
          DB_USER=reraise
          DOCKER_NETWORK=poker-clock_default
          TITLE='CRAZY PINEAPPLE'
          MOSCOW_DATE='2026-09-13'

          section() {
            printf '\n================ %s ================\n' "$1"
          }

          fail() {
            echo "STOP: $*" >&2
            exit 1
          }

          require_healthy_container() {
            local container="$1"
            local status health
            docker inspect "$container" >/dev/null 2>&1 || fail "Required container '$container' was not found."
            status="$(docker inspect "$container" --format '{{.State.Status}}')"
            health="$(docker inspect "$container" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}')"
            [ "$status" = "running" ] && [ "$health" = "healthy" ] \
              || fail "Container '$container' is not healthy (status=$status, health=$health)."
          }

          psql_db() {
            local db="$1"
            shift
            docker exec -i "$DB_CONTAINER" \
              psql -X -q -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$db" "$@"
          }

          psql_x() {
            psql_db "$DB_NAME" "$@"
          }

          section "PREFLIGHT"
          require_healthy_container "$DB_CONTAINER"
          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 \
            || fail "Docker network '$DOCKER_NETWORK' was not found."
          connected_target="$(psql_x -At <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT current_user || '|' || current_database();
          ROLLBACK;
          SQL
          )"
          [ "$connected_target" = "${DB_USER}|${DB_NAME}" ] \
            || fail "psql connected to an unexpected database or user."

          section "A. TOURNAMENT IDENTIFICATION"
          tournament_row="$(psql_x -At -F'|' -v title="$TITLE" -v mdate="$MOSCOW_DATE" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT id, status, kind, tournament_type, is_final,
                 COALESCE(google_sheet_tab_name, ''),
                 (start_at AT TIME ZONE 'Europe/Moscow')::text
          FROM tournaments
          WHERE title = :'title'
            AND (start_at AT TIME ZONE 'Europe/Moscow')::date = :'mdate'::date
          ORDER BY created_at;
          ROLLBACK;
          SQL
          )"
          echo "$tournament_row"

          match_count="$(printf '%s\n' "$tournament_row" | grep -c . || true)"
          if [ "$match_count" -eq 0 ]; then
            section "A2. FALLBACK FUZZY SEARCH (no exact title+date match found above)"
            psql_x -At -F'|' -v mdate="$MOSCOW_DATE" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT id, title, status, (start_at AT TIME ZONE 'Europe/Moscow')::text
          FROM tournaments
          WHERE title ILIKE '%crazy%pineapple%'
             OR (start_at AT TIME ZONE 'Europe/Moscow')::date = :'mdate'::date;
          ROLLBACK;
          SQL
            fail "No exact match for title='$TITLE' on Moscow date $MOSCOW_DATE. See fallback rows above."
          fi
          [ "$match_count" -eq 1 ] \
            || fail "Ambiguous: $match_count tournaments matched title='$TITLE' on Moscow date $MOSCOW_DATE. Refusing to proceed."

          TOURNAMENT_ID="$(printf '%s' "$tournament_row" | cut -d'|' -f1)"
          TOURNAMENT_STATUS="$(printf '%s' "$tournament_row" | cut -d'|' -f2)"
          echo "Resolved TOURNAMENT_ID=$TOURNAMENT_ID status=$TOURNAMENT_STATUS"
          if [ "$TOURNAMENT_STATUS" = "completed" ]; then
            fail "Refusing to continue: tournament status is already 'completed'. This diagnostic is only for a live/non-completed tournament."
          fi

          section "B. PARTICIPANT SOURCE COUNTS"
          psql_x -At -F'|' -v tid="$TOURNAMENT_ID" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT
            (SELECT count(*) FROM registrations WHERE tournament_id = :'tid'::uuid) AS registrations_total,
            (SELECT count(*) FROM registrations WHERE tournament_id = :'tid'::uuid AND status = 'registered') AS registrations_registered,
            (SELECT count(*) FROM registrations WHERE tournament_id = :'tid'::uuid AND status = 'waitlist') AS registrations_waitlist,
            (SELECT count(*) FROM registrations WHERE tournament_id = :'tid'::uuid AND status = 'cancelled') AS registrations_cancelled,
            (SELECT count(*) FROM registrations WHERE tournament_id = :'tid'::uuid AND status = 'attended') AS registrations_attended,
            (SELECT count(*) FROM tournament_live_entries WHERE tournament_id = :'tid'::uuid) AS live_entries_total,
            (SELECT count(*) FROM tournament_attendance WHERE tournament_id = :'tid'::uuid) AS attendance_rows_total,
            (SELECT count(*) FROM tournament_attendance WHERE tournament_id = :'tid'::uuid AND arrived) AS attendance_arrived_true,
            (SELECT count(*) FROM tournament_player_eliminations WHERE tournament_id = :'tid'::uuid) AS elimination_rows_total,
            (SELECT count(*) FROM tournament_player_eliminations WHERE tournament_id = :'tid'::uuid AND eliminated) AS elimination_eliminated_true,
            (SELECT count(*) FROM results WHERE tournament_id = :'tid'::uuid) AS results_total;
          ROLLBACK;
          SQL

          section "C. TOXIN / TO_OXIN IDENTITIES (safe fields only, no telegram_id/username printed)"
          psql_x -At -F'|' -v tid="$TOURNAMENT_ID" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT
            p.id AS player_id,
            p.display_name,
            COALESCE(p.admin_display_name, '') AS admin_display_name,
            COALESCE(p.pending_display_name, '') AS pending_display_name,
            p.nickname_status,
            (p.telegram_id IS NOT NULL) AS telegram_linked,
            (p.merged_into_player_id IS NOT NULL) AS already_merged_elsewhere,
            COALESCE(r.id::text, '') AS registration_id,
            COALESCE(r.status, '') AS registration_status,
            COALESCE(le.id::text, '') AS live_entry_id,
            COALESCE(le.place::text, '') AS live_entry_place,
            COALESCE(att.arrived::text, '') AS attendance_arrived,
            COALESCE(att.arrived_at::text, '') AS attendance_arrived_at,
            COALESCE(el.eliminated::text, '') AS elimination_eliminated,
            COALESCE(el.eliminated_at::text, '') AS elimination_eliminated_at,
            (res.id IS NOT NULL) AS has_result
          FROM players p
          LEFT JOIN registrations r ON r.player_id = p.id AND r.tournament_id = :'tid'::uuid
          LEFT JOIN tournament_live_entries le ON le.player_id = p.id AND le.tournament_id = :'tid'::uuid
          LEFT JOIN tournament_attendance att ON att.player_id = p.id AND att.tournament_id = :'tid'::uuid
          LEFT JOIN tournament_player_eliminations el ON el.player_id = p.id AND el.tournament_id = :'tid'::uuid
          LEFT JOIN results res ON res.player_id = p.id AND res.tournament_id = :'tid'::uuid
          WHERE p.display_name ILIKE '%TOXIN%' OR p.admin_display_name ILIKE '%TOXIN%' OR p.pending_display_name ILIKE '%TOXIN%'
             OR p.display_name ILIKE '%TO_OXIN%' OR p.admin_display_name ILIKE '%TO_OXIN%' OR p.pending_display_name ILIKE '%TO_OXIN%'
             OR p.display_name ILIKE '%TO OXIN%' OR p.admin_display_name ILIKE '%TO OXIN%' OR p.pending_display_name ILIKE '%TO OXIN%'
          ORDER BY p.display_name;
          ROLLBACK;
          SQL

          section "D. FULL PLACEMENT LADDER (every player with an attendance row in this tournament)"
          echo "(source: tournament_attendance = 'В игре'/'Выбыли' authoritative state per app/api/tournaments/[id]/active-players/route.ts;"
          echo " tournament_player_eliminations.eliminated_at drives elimination order; tournament_live_entries.place is the"
          echo " separate paid/cash live-entry field, shown alongside for cross-reference; field size = count(arrived=true) below.)"
          psql_x -At -F'|' -v tid="$TOURNAMENT_ID" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT
            p.id AS player_id,
            p.display_name,
            att.arrived,
            COALESCE(el.eliminated, false) AS eliminated,
            COALESCE(el.eliminated_at::text, '') AS eliminated_at,
            COALESCE(le.place::text, '') AS live_entry_place
          FROM tournament_attendance att
          JOIN players p ON p.id = att.player_id
          LEFT JOIN tournament_player_eliminations el ON el.player_id = att.player_id AND el.tournament_id = att.tournament_id
          LEFT JOIN tournament_live_entries le ON le.player_id = att.player_id AND le.tournament_id = att.tournament_id
          WHERE att.tournament_id = :'tid'::uuid
          ORDER BY (el.eliminated_at IS NULL) ASC, el.eliminated_at ASC;
          ROLLBACK;
          SQL

          section "E. POKER CLOCK -- co-located database best-effort check (table names only, no data read)"
          echo "(Re-Raise stores no clock_tournament_id column of its own -- lib/poker-clock-client.ts confirms Poker Clock"
          echo " resolves the binding by Re-Raise's own tournament id over its separate HTTP API, not the reverse. This section"
          echo " only checks whether Poker Clock's Postgres happens to be co-located on the SAME instance as reraise.)"
          other_dbs="$(psql_db postgres -At <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT datname FROM pg_database WHERE datistemplate = false AND datname <> 'reraise' AND datname !~ '^(template|postgres)$';
          ROLLBACK;
          SQL
          )"
          if [ -z "$other_dbs" ]; then
            echo "No other non-system databases found on this Postgres instance -- Poker Clock's DB (if it exists at all) is not co-located here; it is a separate deployment reachable only via lib/poker-clock-client.ts's HTTP API, which this diagnostic does not call."
          else
            while IFS= read -r other_db; do
              [ -n "$other_db" ] || continue
              echo "--- database: $other_db ---"
              psql_db "$other_db" -At <<'SQL' || echo "(could not list tables for this database)"
          BEGIN TRANSACTION READ ONLY;
          SELECT schemaname || '.' || tablename
          FROM pg_tables
          WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
          ORDER BY 1;
          ROLLBACK;
          SQL
            done <<< "$other_dbs"
          fi

          section "F. Application container logs mentioning this tournament id (best-effort, last 30 days, redacted)"
          docker logs --since 720h re-raise 2>&1 | grep -F "${TOURNAMENT_ID}" | tail -n 80 |
            sed -E -e 's/(Bearer )[A-Za-z0-9._~+\/-]+/\1[REDACTED]/Ig' -e 's/((token|secret|password|cookie|authorization)[=: ]+)[^ ]+/\1[REDACTED]/Ig' \
            || echo "(no matching log lines found, or logs not retained that far back)"

          section "Diagnostic complete -- zero writes performed anywhere. Tournament status confirmed non-completed above."
          REMOTE_SCRIPT
