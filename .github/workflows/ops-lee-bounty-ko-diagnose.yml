name: "Ops: Lee BOUNTY HUNTERS KO diagnostic (read-only)"

# One-time, read-only production diagnostic -- NOT a general tool, performs
# ZERO writes anywhere (every query against `reraise` runs inside
# BEGIN TRANSACTION READ ONLY; ... ROLLBACK;). Exists to find out where a
# KO value of 8 for Lee (player_id f9cfd805-6444-423e-8219-b7be7f143765) in
# tournament a787f33b-1213-4246-b85e-3f6c5810f636 (BOUNTY HUNTERS,
# 2026-09-10) might currently live, given `results.knockouts` there is
# confirmed to be 0 (not 8) -- see the accompanying investigation.
#
# Delete this workflow file once the investigation concludes.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Read-only diagnostic across every KO-bearing source
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_SSH_PORT || 22 }}" \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          umask 077

          DB_CONTAINER=poker-clock-db
          APP_CONTAINER=re-raise
          DB_NAME=reraise
          DB_USER=reraise
          DOCKER_NETWORK=poker-clock_default
          TOURNAMENT_ID='a787f33b-1213-4246-b85e-3f6c5810f636'
          PLAYER_ID='f9cfd805-6444-423e-8219-b7be7f143765'
          SHEET_TAB_NAME='10.09 | BOUNTY HUNTERS | a787'

          section() {
            printf '\n================ %s ================\n' "$1"
          }

          fail() {
            echo "STOP: $*" >&2
            exit 1
          }

          require_healthy_container() {
            local container="$1"
            local status health
            docker inspect "$container" >/dev/null 2>&1 || fail "Required container '$container' was not found."
            status="$(docker inspect "$container" --format '{{.State.Status}}')"
            health="$(docker inspect "$container" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}')"
            [ "$status" = "running" ] && [ "$health" = "healthy" ] \
              || fail "Container '$container' is not healthy (status=$status, health=$health)."
          }

          psql_db() {
            local db="$1"
            shift
            docker exec -i "$DB_CONTAINER" \
              psql -X -q -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$db" "$@"
          }

          psql_x() {
            psql_db "$DB_NAME" "$@"
          }

          section "PREFLIGHT"
          require_healthy_container "$DB_CONTAINER"
          require_healthy_container "$APP_CONTAINER"
          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 \
            || fail "Docker network '$DOCKER_NETWORK' was not found."
          connected_target="$(psql_x -At <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT current_user || '|' || current_database();
          ROLLBACK;
          SQL
          )"
          [ "$connected_target" = "${DB_USER}|${DB_NAME}" ] \
            || fail "psql connected to an unexpected database or user."

          section "A. results"
          psql_x -At -F'|' <<SQL
          BEGIN TRANSACTION READ ONLY;
          SELECT knockouts, knockout_points, rating_points, participation_points,
                 boss_bounty_points, mystery_bounty_points, itm_points, created_at
          FROM results
          WHERE tournament_id = '${TOURNAMENT_ID}' AND player_id = '${PLAYER_ID}';
          ROLLBACK;
          SQL

          section "B. tournament_live_entries"
          psql_x -At -F'|' <<SQL
          BEGIN TRANSACTION READ ONLY;
          SELECT knockouts, boss_knockouts, place, addons, rebuys, arrived,
                 created_at, updated_at
          FROM tournament_live_entries
          WHERE tournament_id = '${TOURNAMENT_ID}' AND player_id = '${PLAYER_ID}';
          ROLLBACK;
          SQL
          echo "(empty output above means no live-entry row exists for this player/tournament)"

          section "C. registrations (schema + row -- confirm no KO field exists)"
          psql_x -At <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT string_agg(column_name, ', ') FROM information_schema.columns WHERE table_name = 'registrations';
          ROLLBACK;
          SQL
          psql_x -At -F'|' <<SQL
          BEGIN TRANSACTION READ ONLY;
          SELECT id, status, created_at
          FROM registrations
          WHERE tournament_id = '${TOURNAMENT_ID}' AND player_id = '${PLAYER_ID}';
          ROLLBACK;
          SQL

          section "D. tournaments row (google_sheet_tab_name / status / type / formula)"
          psql_x -At -F'|' <<SQL
          BEGIN TRANSACTION READ ONLY;
          SELECT title, status, tournament_type, rating_formula_version,
                 kind, google_sheet_tab_name, start_at, created_at
          FROM tournaments
          WHERE id = '${TOURNAMENT_ID}';
          ROLLBACK;
          SQL

          section "E. Other databases on this same Postgres instance (best-effort Poker Clock check)"
          psql_db postgres -At <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT datname FROM pg_database WHERE datistemplate = false ORDER BY datname;
          ROLLBACK;
          SQL

          section "E2. Non-reraise databases: table inventory (names only, no data read)"
          other_dbs="$(psql_db postgres -At <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT datname FROM pg_database WHERE datistemplate = false AND datname <> 'reraise' AND datname !~ '^(template|postgres)$';
          ROLLBACK;
          SQL
          )"
          if [ -z "$other_dbs" ]; then
            echo "No other non-system databases found on this Postgres instance -- Poker Clock (if it exists at all) is not co-located here."
          else
            while IFS= read -r other_db; do
              [ -n "$other_db" ] || continue
              echo "--- database: $other_db ---"
              psql_db "$other_db" -At <<'SQL' || echo "(could not list tables for this database)"
          BEGIN TRANSACTION READ ONLY;
          SELECT schemaname || '.' || tablename
          FROM pg_tables
          WHERE schemaname NOT IN ('pg_catalog', 'information_schema')
          ORDER BY 1;
          ROLLBACK;
          SQL
            done <<< "$other_dbs"
          fi

          section "F. Application container logs mentioning this tournament (best-effort, last 30 days)"
          docker logs --since 720h re-raise 2>&1 | grep -F "${TOURNAMENT_ID}" | tail -n 50 || echo "(no matching log lines found, or logs not retained that far back)"

          section "G. Google Sheet 'Nok' value for Lee (read-only Sheets API read, via the app container's own service-account credentials)"
          cat > /tmp/sheet_check.js <<'NODE_EOF'
          // The script file lives at /tmp/sheet_check.js -- require()'s
          // file-relative resolution never reaches /app/node_modules from
          // there. Try the default resolution first, then the app's own
          // node_modules explicitly (confirmed at /app, same root
          // production-migrations.yml already references).
          let google;
          try {
            google = require("googleapis").google;
          } catch (defaultResolveError) {
            try {
              google = require("/app/node_modules/googleapis").google;
            } catch (explicitResolveError) {
              console.log("SHEET_ROW_FOUND=ERROR_MODULE_NOT_FOUND");
              console.log(
                "SHEET_ERROR_MESSAGE=" +
                  defaultResolveError.message +
                  " | " +
                  explicitResolveError.message
              );
              process.exit(0);
            }
          }

          const clientEmail = process.env.GOOGLE_CLIENT_EMAIL;
          const privateKeyRaw = process.env.GOOGLE_PRIVATE_KEY;
          const spreadsheetId = process.env.GOOGLE_SHEETS_SPREADSHEET_ID;
          const tabName = process.env.SHEET_TAB_NAME_TO_CHECK;
          const playerId = process.env.PLAYER_ID_TO_FIND;

          if (!clientEmail || !privateKeyRaw || !spreadsheetId || !tabName || !playerId) {
            console.log("SHEET_ROW_FOUND=ERROR_MISSING_INPUT");
            process.exit(0);
          }

          // Mirrors lib/google-sheets.ts's normalizePrivateKey exactly --
          // never logs clientEmail/privateKey/spreadsheetId themselves.
          const trimmed = privateKeyRaw.trim();
          const unwrapped =
            trimmed.startsWith('"') && trimmed.endsWith('"') ? trimmed.slice(1, -1) : trimmed;
          const privateKey = unwrapped.replace(/\\n/g, "\n");

          const auth = new google.auth.JWT({
            email: clientEmail,
            key: privateKey,
            scopes: ["https://www.googleapis.com/auth/spreadsheets.readonly"],
          });

          const sheets = google.sheets({ version: "v4", auth });

          // Exact header layout copied verbatim from
          // lib/tournament-sheet-parsing.ts::getFreeSheetColumnLayout("bounty")
          // -- not invented. knockoutsIndex=11, placeIndex=12 (bounty has no
          // extra Boss-Nok/Bounty-Points column), header row at values[6],
          // data rows from values[7] -- same "+8" sheet-row convention the
          // real parser uses.
          const EXPECTED_HEADERS = [
            "Player ID", "System", "Ник", "Telegram",
            "Статус регистрации",
            "Пришел", "Оплатил",
            "Нал/карта", "Беспл. re-entry",
            "Re-buy", "Addon", "Nok", "Место", "Рейтинг",
            "Выбыл", "Время выбытия",
          ];
          const KNOCKOUTS_INDEX = 11;
          const PLACE_INDEX = 12;
          const ADDONS_INDEX = 10;
          const REENTRIES_INDEX = 9;
          const DISPLAY_NAME_INDEX = 2;

          function cell(row, index) {
            const value = row[index];
            return value == null ? "" : String(value).trim();
          }

          async function main() {
            const range = "'" + tabName + "'!A1:P60";
            const res = await sheets.spreadsheets.values.get({ spreadsheetId, range });
            const values = res.data.values || [];

            const headerRow = (values[6] || []).map((c) => (c == null ? "" : String(c).trim()));
            for (let i = 0; i < EXPECTED_HEADERS.length; i++) {
              if (headerRow[i] !== EXPECTED_HEADERS[i]) {
                console.log("SHEET_ROW_FOUND=ERROR_HEADER_MISMATCH");
                console.log("SHEET_HEADER_MISMATCH_AT_COLUMN=" + i);
                return;
              }
            }

            const dataRows = values.slice(7);
            const match = dataRows.find((row) => cell(row, 0) === playerId);

            if (!match) {
              console.log("SHEET_ROW_FOUND=NO");
              return;
            }

            console.log("SHEET_ROW_FOUND=YES");
            console.log("SHEET_DISPLAY_NAME=" + cell(match, DISPLAY_NAME_INDEX));
            console.log("SHEET_KNOCKOUTS=" + cell(match, KNOCKOUTS_INDEX));
            console.log("SHEET_PLACE=" + cell(match, PLACE_INDEX));
            console.log("SHEET_ADDONS=" + cell(match, ADDONS_INDEX));
            console.log("SHEET_REENTRIES=" + cell(match, REENTRIES_INDEX));
          }

          main().catch((err) => {
            console.log("SHEET_ROW_FOUND=ERROR");
            console.log("SHEET_ERROR_MESSAGE=" + (err && err.message ? String(err.message) : "unknown"));
          });
          NODE_EOF
          # umask 077 above makes this file mode 600; chmod it here on the
          # HOST, where we own it (trivially succeeds), BEFORE docker cp --
          # a post-copy chmod INSIDE the container fails with EPERM because
          # the container's node process runs as a non-root user that does
          # not own the root-copied file (confirmed: "Operation not
          # permitted"). 644 (world-readable) survives the copy and lets
          # that non-root user read it without needing root inside the
          # container at all.
          chmod 644 /tmp/sheet_check.js
          docker cp /tmp/sheet_check.js "${APP_CONTAINER}:/tmp/sheet_check.js"
          docker exec \
            -e SHEET_TAB_NAME_TO_CHECK="${SHEET_TAB_NAME}" \
            -e PLAYER_ID_TO_FIND="${PLAYER_ID}" \
            -w /app "$APP_CONTAINER" node /tmp/sheet_check.js
          docker exec "$APP_CONTAINER" rm -f /tmp/sheet_check.js
          rm -f /tmp/sheet_check.js

          section "Diagnostic complete -- zero writes performed anywhere."
          REMOTE_SCRIPT
