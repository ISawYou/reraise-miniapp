name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # The real `next build` happens here, inside `docker compose build app`
      # on the VPS — not in the job above. docker compose auto-loads
      # /opt/reraise/.env for the build args (NEXT_PUBLIC_SUPABASE_URL,
      # SUPABASE_SERVICE_ROLE_KEY, etc.), exactly like the old manual deploy,
      # so GitHub Actions never needs those values as Secrets. If the build
      # fails, `set -e` stops the script before `up -d` runs, so a broken
      # build never reaches the running container. Only the app service is
      # touched: no `docker compose down`, `--no-deps` prevents any
      # cross-service restart, poker-clock-db and the storage bind mount are
      # untouched.
      - name: Deploy to VPS
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_SSH_PORT || 22 }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
              set -e
              cd /opt/reraise
              git pull --ff-only origin main
              docker compose build app
              docker compose up -d --no-deps app
              docker image prune -f

              for i in $(seq 1 10); do
                if wget -q -O /dev/null http://127.0.0.1:3002/api/health; then
                  echo "Container healthy"
                  exit 0
                fi
                sleep 3
              done
              echo "Container did not become healthy in time" >&2
              exit 1
            '

      - name: Verify API responds
        run: |
          for i in $(seq 1 10); do
            if curl -fsS -o /dev/null https://re-raise.ru/api/settings; then
              echo "API responded 200"
              exit 0
            fi
            sleep 3
          done
          echo "API did not respond 200 in time" >&2
          exit 1
