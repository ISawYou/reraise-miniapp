name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/isawyou/re-raise

permissions:
  contents: read

jobs:
  # Fast, cheap checks — safe to cancel a superseded run of this job the
  # moment a newer commit is pushed, since it has no side effects.
  checks:
    runs-on: ubuntu-latest
    concurrency:
      group: checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

  # Builds the production image ONCE, on the runner's own isolated
  # resources — never on the shared production VPS (see the 2026-08-22
  # incident: `docker compose build app` running on the VPS pinned both
  # CPUs and exhausted RAM on a 2-core/3.8GB box with zero swap, taking
  # every other app on it offline for the duration of the build). Tagged
  # immutably by commit SHA -- `latest` is also pushed for
  # convenience/manual pulls, but the deploy job below always pulls the SHA
  # tag specifically, never `latest`. No SUPABASE_SERVICE_ROLE_KEY build
  # arg: app/api/leaderboard/route.ts is force-dynamic, so nothing in the
  # app touches a database during `next build`.
  build:
    needs: checks
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `${{ secrets.X }}` for a secret that was never configured silently
      # resolves to an empty string -- it does NOT fail the workflow. Left
      # unchecked, a missing secret here means "successfully" building and
      # pushing a production image with blank NEXT_PUBLIC_* values baked
      # into the client bundle, which only surfaces later as a broken site.
      # Fail loudly before any build/push work happens instead.
      - name: Verify required build secrets are present
        run: |
          set -Eeuo pipefail
          missing=""
          [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ] && missing="$missing NEXT_PUBLIC_SUPABASE_URL"
          [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ] && missing="$missing NEXT_PUBLIC_SUPABASE_ANON_KEY"
          [ -z "${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_ID }}" ] && missing="$missing NEXT_PUBLIC_TELEGRAM_BOT_ID"
          [ -z "${{ secrets.NEXT_PUBLIC_APP_URL }}" ] && missing="$missing NEXT_PUBLIC_APP_URL"
          if [ -n "$missing" ]; then
            echo "Missing required repository secrets:$missing" >&2
            exit 1
          fi
          echo "All required build secrets are present."

      # The runner's default buildx builder uses the "docker" driver,
      # which can't export to the GitHub Actions cache backend
      # (cache-to/cache-from: type=gha below) -- only the "docker-container"
      # driver this creates supports it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_TELEGRAM_BOT_ID=${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_ID }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Everything below runs on the VPS, but only ever pull/recreate/verify —
  # never `docker build`/`docker compose build`/buildx/`npm run build`.
  # cancel-in-progress is deliberately false: a `docker compose up -d`
  # recreation caught mid-flight by a cancellation is exactly the kind of
  # "server left in an in-between state" the app owner does not want. A
  # newer push instead queues behind this one (and if a third push lands
  # while one is already queued, GitHub keeps only the newest queued run —
  # older superseded commits are dropped, not deployed one by one), so
  # deploys always run to full completion and the server always converges
  # on the latest pushed commit. This job's own VPS-side work is now just
  # a pull + container recreate + health/smoke checks -- short, and no
  # longer CPU/RAM-heavy even if a manual cancel does hit it mid-flight.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # Gives this job's own runner the exact github.sha content -- needed
      # below to hand the VPS this commit's docker-compose.yml without the
      # VPS ever having to talk to GitHub itself (see the "Transfer
      # production compose config" step). The build job above checks out
      # separately on its own runner instance; this job gets nothing for
      # free just because that one ran.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # Ships this exact commit's docker-compose.yml to the VPS as a
      # not-yet-canonical file, over the same SSH connection used for
      # everything else here -- no VPS-side `git fetch`/`pull` of the
      # GitHub repo required (that dependency is what took production
      # deploys down when the VPS's stored git credentials stopped
      # authenticating: "could not read Username for 'https://github.com'").
      # The runner's checkout above already has the exact github.sha
      # content; this just moves one file over. Verified by a SHA256
      # checksum computed here and re-checked on the VPS before the deploy
      # step ever reads it, so a corrupted/truncated transfer is caught
      # immediately rather than silently recreating the app container from
      # a broken compose file.
      #
      # Runs before the deploy step's production lock, deliberately: this
      # temp file isn't referenced by any running container yet and
      # nothing here mutates Docker state, so there's nothing for a
      # concurrent deploy/maintenance run to race by it existing early.
      # Written directly into /opt/reraise (not a subdirectory) so its
      # `./storage` volume path still resolves to /opt/reraise/storage,
      # exactly like the canonical file next to it.
      - name: Transfer production compose config to VPS
        run: |
          set -Eeuo pipefail
          CHECKSUM="$(sha256sum docker-compose.yml | awk '{print $1}')"
          echo "Local docker-compose.yml SHA256: $CHECKSUM"

          scp -i ~/.ssh/deploy_key -P "${{ secrets.VPS_SSH_PORT || 22 }}" \
            -o StrictHostKeyChecking=yes \
            docker-compose.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/reraise/docker-compose.deploy.yml"

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_SSH_PORT || 22 }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s -- "$CHECKSUM" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          EXPECTED_CHECKSUM="$1"
          ACTUAL_CHECKSUM="$(sha256sum /opt/reraise/docker-compose.deploy.yml | awk '{print $1}')"
          echo "Remote docker-compose.deploy.yml SHA256: $ACTUAL_CHECKSUM"
          if [ "$ACTUAL_CHECKSUM" != "$EXPECTED_CHECKSUM" ]; then
            echo "Checksum mismatch after transfer -- refusing to use this file." >&2
            rm -f /opt/reraise/docker-compose.deploy.yml
            exit 1
          fi
          echo "Transfer verified."
          REMOTE_SCRIPT

      # Single SSH session, single strict-mode remote script: pull the
      # already-built image by its immutable SHA tag, recreate only the
      # app container against it, wait for a genuine running+healthy
      # state, smoke-test the public site, and roll back to whatever
      # image was running before on any failure. Any failing command that
      # isn't explicitly handled aborts the whole script (set -Eeuo
      # pipefail); the rollback path itself still exits 1 so the workflow
      # is red even when the rollback succeeds -- a failed deploy is a
      # failed deploy, it just must not take re-raise down with it.
      # poker-clock-db, the external network, volumes and the storage bind
      # mount are never touched: only `docker pull` / `up -d --no-deps`
      # run, never `down`, and no other app on the VPS is touched.
      #
      # No VPS-side GitHub dependency of any kind: SHA trust comes from the
      # runner's own `actions/checkout@v4` + the immutable `IMAGE:$EXPECTED_SHA`
      # tag built by the `build` job, and config trust comes from the
      # checksum-verified transfer above -- not from a VPS git remote.
      - name: Deploy (pull + recreate + health + rollback) on VPS
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_SSH_PORT || 22 }}" \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          EXPECTED_SHA="${{ github.sha }}"
          IMAGE="${{ env.IMAGE }}"
          cd /opt/reraise

          NEW_IMAGE_REF="$IMAGE:$EXPECTED_SHA"

          # The checksum-verified upload from the previous step. Used for
          # the forward deploy only, until it passes health+smoke below --
          # the canonical docker-compose.yml on disk right now is still
          # whatever version was live before this run, and stays that way
          # for the rollback path.
          DEPLOY_COMPOSE=/opt/reraise/docker-compose.deploy.yml
          CANONICAL_COMPOSE=/opt/reraise/docker-compose.yml
          if [ ! -f "$DEPLOY_COMPOSE" ]; then
            echo "$DEPLOY_COMPOSE not found -- the transfer step should have placed and verified it before this step ran." >&2
            exit 1
          fi

          echo "== Capturing the currently running image as the rollback target =="
          PREVIOUS_CONTAINER_ID="$(docker compose -f "$CANONICAL_COMPOSE" ps -q app || true)"
          PREVIOUS_IMAGE_ID=""
          if [ -n "$PREVIOUS_CONTAINER_ID" ]; then
            PREVIOUS_IMAGE_ID="$(docker inspect "$PREVIOUS_CONTAINER_ID" --format '{{.Image}}')"
            echo "Previous running image: $PREVIOUS_IMAGE_ID"
          else
            echo "No previous app container found -- no rollback target available for this run."
          fi

          # ============ SHARED VPS PRODUCTION LOCK ============
          # /var/lock/poker-production.lock is the single mutex meant to be
          # shared by every production-mutating section on this VPS: this
          # deploy, the three sibling projects' deploy.yml (poker-app,
          # poker-clock, spb-poker -- not yet wired as of this change, see
          # report), and re-raise's own maintenance.yml. GitHub Actions
          # `concurrency:` groups are scoped per repository and do NOT
          # provide this on their own -- confirmed by reading poker-app's
          # and spb-poker's own maintenance.yml comments, which each
          # independently reached the same conclusion.
          #
          # Taken here, immediately before the first Docker state mutation
          # (`docker pull`) -- not any earlier. Everything above this line
          # (locating the transferred compose file, capturing the previous
          # image) only reads state, so holding the VPS-wide lock during the
          # `checks`/`build` jobs (which don't even SSH into the VPS) or
          # during those reads would only make the lock be held longer than
          # necessary. Promotion of $DEPLOY_COMPOSE to $CANONICAL_COMPOSE
          # below, like every other Docker mutation, happens inside this
          # critical section too.
          #
          # Acquired via flock on an fd opened with `exec` -- not a
          # touch/rm homemade lock file -- so it releases automatically the
          # moment this script's process exits, for any reason (success,
          # failure, or an uncaught error under `set -Eeuo pipefail`,
          # rollback included), with no explicit unlock step required.
          LOCK_PATH=/var/lock/poker-production.lock
          LOCK_WAIT_SECONDS=300
          echo "Acquiring shared VPS production lock ($LOCK_PATH, waiting up to ${LOCK_WAIT_SECONDS}s)..."
          exec 9>"$LOCK_PATH"
          if ! flock -w "$LOCK_WAIT_SECONDS" 9; then
            echo "Could not acquire the shared VPS production lock within ${LOCK_WAIT_SECONDS}s -- another deploy or maintenance run is holding it. Refusing to pull or touch any Docker state." >&2
            exit 1
          fi
          echo "Lock acquired (pid $$). Pull, migrate/recreate, health and rollback all run inside this critical section; the lock releases automatically when this script exits."

          echo "== Pulling the built image (no build ever happens here) =="
          docker pull "$NEW_IMAGE_REF"
          NEW_IMAGE_ID="$(docker image inspect "$NEW_IMAGE_REF" --format '{{.Id}}')"
          echo "New image ID: $NEW_IMAGE_ID"

          # Recreates the app container against $1 (an image reference or
          # image ID -- both work as a compose `image:` value), using the
          # compose file $2, waits for running+healthy, then runs the same
          # public smoke tests the old pipeline had. Used for both the
          # forward deploy ($DEPLOY_COMPOSE, the transferred exact-SHA
          # file) and, on failure, the rollback ($CANONICAL_COMPOSE, the
          # untouched previous version) -- identical verification either
          # way. Both files live directly in /opt/reraise with no `name:`
          # key of their own, so they resolve to the same Compose project
          # and the fixed `container_name: re-raise` in both means either
          # one recreates the exact same container in place.
          verify_and_smoke() {
            local image_ref="$1"
            local compose_file="$2"
            export RERAISE_IMAGE="$image_ref"

            docker compose -f "$compose_file" up -d --no-deps app

            local container_id
            container_id="$(docker compose -f "$compose_file" ps -q app)"
            if [ -z "$container_id" ]; then
              echo "No 'app' container found after 'docker compose up -d'." >&2
              return 1
            fi

            local running_image_id
            running_image_id="$(docker inspect "$container_id" --format '{{.Image}}')"
            echo "Running container's image ID: $running_image_id"
            echo "Running container created at: $(docker inspect "$container_id" --format '{{.Created}}')"

            local deploy_timeout=120
            local interval=5
            local elapsed=0
            while true; do
              local status health
              status="$(docker inspect "$container_id" --format '{{.State.Status}}')"
              health="$(docker inspect "$container_id" --format '{{.State.Health.Status}}')"

              if [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
                echo "Container entered terminal state '$status'." >&2
                docker compose -f "$compose_file" ps
                docker compose -f "$compose_file" logs --tail 200 app
                return 1
              fi

              if [ "$health" = "unhealthy" ]; then
                echo "Container reported unhealthy." >&2
                docker compose -f "$compose_file" ps
                docker compose -f "$compose_file" logs --tail 200 app
                return 1
              fi

              if [ "$status" = "running" ] && [ "$health" = "healthy" ]; then
                echo "Container is running and healthy after ${elapsed}s."
                break
              fi

              if [ "$elapsed" -ge "$deploy_timeout" ]; then
                echo "Timed out after ${deploy_timeout}s waiting for running+healthy (status=$status health=$health)." >&2
                docker compose -f "$compose_file" ps
                docker compose -f "$compose_file" logs --tail 200 app
                return 1
              fi

              sleep "$interval"
              elapsed=$((elapsed + interval))
            done

            echo "== Smoke-testing the public site =="

            echo "GET https://re-raise.ru/api/health"
            local health_body
            health_body="$(curl --fail --silent --show-error https://re-raise.ru/api/health)" || return 1
            echo "Body: $health_body"
            if [ "$health_body" != '{"ok":true}' ]; then
              echo "Unexpected /api/health body: $health_body" >&2
              return 1
            fi

            echo "GET https://re-raise.ru/api/settings"
            curl --fail --silent --show-error https://re-raise.ru/api/settings > /dev/null || return 1

            echo "GET https://re-raise.ru/"
            curl --fail --silent --show-error https://re-raise.ru/ > /dev/null || return 1

            # /api/leaderboard legitimately returns 404 when there is no
            # active season (see app/api/leaderboard/route.ts) — that is a
            # real, documented business state, not a broken deploy. Only
            # something other than 200/404 (5xx, unreachable, ...) fails here.
            echo "GET https://re-raise.ru/api/leaderboard"
            local leaderboard_status
            leaderboard_status="$(curl --silent --output /dev/null --write-out '%{http_code}' https://re-raise.ru/api/leaderboard)"
            echo "Status: $leaderboard_status"
            case "$leaderboard_status" in
              200|404) ;;
              *)
                echo "Unexpected /api/leaderboard status: $leaderboard_status" >&2
                return 1
                ;;
            esac
          }

          set +e
          verify_and_smoke "$NEW_IMAGE_REF" "$DEPLOY_COMPOSE"
          DEPLOY_RESULT=$?
          set -e

          if [ "$DEPLOY_RESULT" -ne 0 ]; then
            echo "== New image ($NEW_IMAGE_REF) failed verification -- rolling back ==" >&2

            if [ -z "$PREVIOUS_IMAGE_ID" ]; then
              echo "No previous image available to roll back to -- re-raise may be down. Manual intervention required." >&2
              rm -f "$DEPLOY_COMPOSE"
              exit 1
            fi

            set +e
            verify_and_smoke "$PREVIOUS_IMAGE_ID" "$CANONICAL_COMPOSE"
            ROLLBACK_RESULT=$?
            set -e

            if [ "$ROLLBACK_RESULT" -ne 0 ]; then
              echo "Rollback to the previous image ALSO failed verification -- manual intervention required immediately." >&2
              rm -f "$DEPLOY_COMPOSE"
              exit 1
            fi

            echo "Rollback succeeded: previous image ($PREVIOUS_IMAGE_ID) restored and healthy."
            # $CANONICAL_COMPOSE was never touched by this failed attempt,
            # so the rollback above already put production back exactly as
            # it was before this run started -- nothing further to restore.
            # Only the never-promoted temp file needs cleaning up.
            rm -f "$DEPLOY_COMPOSE"
            # PREVIOUS_IMAGE_ID never becomes the rollback-previous marker
            # here -- this deploy attempt FAILED, so nothing about
            # production's known-good history has changed: it was $IMAGE
            # before this run and it still is. Touching the marker on a
            # failed run would let a still-unverified image sneak into
            # maintenance's retention KEEP set on some future run. Exiting
            # 1 without updating it is correct, not an oversight.
            exit 1
          fi

          # Only reached when the NEW image passed health+smoke against the
          # transferred exact-SHA compose file. Promote it to canonical now
          # -- atomically, via `mv` on the same filesystem -- so
          # /opt/reraise/docker-compose.yml matches what's actually running
          # from this point on, and any later run's rollback path (which
          # always reads $CANONICAL_COMPOSE) targets the right version.
          # Still inside the lock acquired above.
          mv -f "$DEPLOY_COMPOSE" "$CANONICAL_COMPOSE"
          echo "Promoted $DEPLOY_COMPOSE -> $CANONICAL_COMPOSE"

          # Only reached when the NEW image passed health+smoke -- this is
          # the one place this deploy is allowed to update the shared
          # rollback-previous marker maintenance.yml's retention.sh reads.
          # It is retagged to $PREVIOUS_IMAGE_ID (the image that was
          # actually running and healthy in production immediately before
          # this deploy started) -- never to the new image, and never on
          # any of the failure/rollback paths above. This is a purely
          # local Docker tag (never pushed to GHCR); GHCR keeps every real
          # SHA tag as the source of truth for the rare manual re-pull of
          # something older than what this marker tracks. Still inside the
          # lock acquired above, so this can't race a concurrent
          # maintenance run reading the marker mid-update.
          if [ -n "$PREVIOUS_IMAGE_ID" ]; then
            docker tag "$PREVIOUS_IMAGE_ID" "$IMAGE:rollback-previous"
            echo "Updated rollback-previous marker: $IMAGE:rollback-previous -> $PREVIOUS_IMAGE_ID"
          else
            echo "No previous running image was captured at the start of this deploy (first deploy on this host, or the container didn't exist yet) -- rollback-previous marker left as-is. maintenance's retention.sh fails closed (deletes nothing) for this project until the marker exists."
          fi

          echo "Deploy complete: $EXPECTED_SHA is live and healthy (image $NEW_IMAGE_ID)."
          REMOTE_SCRIPT
