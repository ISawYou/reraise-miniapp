name: Maintenance

on:
  schedule:
    # Monday 03:00 UTC = Monday 06:00 Moscow time (UTC+3, no DST) —
    # deliberately after Sunday-night poker tournaments have wrapped up,
    # not during. Cron in GitHub Actions is always UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      retention_mode:
        description: >-
          Tagged deployment image retention (maintenance/scripts/retention.sh):
          dry-run only reports KEEP/DELETE, apply actually removes images.
          Scheduled (cron) runs always apply -- see the RETENTION_MODE step
          below -- now that re-raise, poker-app, poker-clock and spb-poker
          have all verified they take the same /var/lock/poker-production.lock
          in their own deploy.yml. This input only controls manual dispatch
          runs, and defaults to dry-run so a manual run never deletes
          anything unless apply is explicitly chosen.
        required: false
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately the SAME concurrency group deploy.yml's `deploy` job
    # uses — not a copy-paste accident. This is intra-repo only (GitHub
    # Actions concurrency groups do not span repositories — confirmed by
    # reading poker-app's and spb-poker's own maintenance.yml comments,
    # which independently arrived at the same conclusion). It still serializes
    # this repo's own maintenance runs against this repo's own deploy runs
    # at the GitHub Actions layer, on top of (not instead of) the real
    # cross-repo protection: the VPS-side flock taken below, which as of
    # this change re-raise, poker-app, poker-clock and spb-poker's deploy.yml
    # all take too (verified against each repo's actual workflow file, not
    # assumed -- see report), making it a genuine four-project mutex.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine retention mode
        id: retention
        run: |
          set -Eeuo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Hard-coded, not driven by the dispatch input: scheduled runs
            # now apply. This was gated on dry-run until poker-app,
            # poker-clock and spb-poker's own deploy.yml all took
            # /var/lock/poker-production.lock before their first `docker
            # pull` -- without that, this VPS-wide retention could have
            # deleted an image one of those three just pulled for an
            # in-flight deploy that hadn't recreated its container yet. All
            # four deploy flows now take that same lock (verified against
            # each repo's actual workflow file), so the scheduled run is
            # safe to apply.
            echo "mode=apply" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.retention_mode }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # Uploads this exact commit's retention.sh to the VPS. Deliberately
      # not relying on /opt/reraise already having a fresh `git pull` (that
      # only happens during deploy.yml's run, which may be arbitrarily
      # stale relative to this workflow run) -- this way the script that
      # runs is always the one this workflow was actually triggered with.
      - name: Upload retention script to VPS
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_SSH_PORT || 22 }}" \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'cat > /tmp/poker-production-retention.sh && chmod +x /tmp/poker-production-retention.sh' \
            < maintenance/scripts/retention.sh

      # Every command here is scoped to either the shared VPS production
      # lock's own retention logic (tagged deployment images only, see
      # retention.sh), BuildKit's own cache store, dangling (untagged)
      # images, systemd's journal, or npm's package cache -- none of those
      # code paths can touch a running container, a volume, or a bind
      # mount, and retention.sh never uses `docker rmi -f` or
      # `docker image prune -a`. See the PR/report for the full safety
      # rationale.
      - name: Run maintenance on VPS
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_SSH_PORT || 22 }}" \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" bash -s <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          RETENTION_MODE="${{ steps.retention.outputs.mode }}"

          # ============ SHARED VPS PRODUCTION LOCK ============
          # /var/lock/poker-production.lock is the single mutex shared by
          # every production-mutating section on this VPS: this maintenance
          # run, and each of the four projects' deploy.yml (re-raise,
          # poker-app, poker-clock, spb-poker) -- all four confirmed to take
          # this same lock before their first `docker pull` (see report).
          # GitHub Actions `concurrency:` groups are scoped per repository
          # and do NOT provide this on their own (see the comment on the
          # job above), so this flock is the only thing actually preventing
          # this run's deletes from racing an in-flight deploy on any of
          # the other three projects.
          #
          # Acquired via flock on an fd opened with `exec` -- not a
          # touch/rm homemade lock file -- so it is released automatically
          # the moment this script's process exits, for any reason
          # (success, failure, or an uncaught error under `set -Eeuo
          # pipefail`), with no explicit unlock step required.
          LOCK_PATH=/var/lock/poker-production.lock
          LOCK_WAIT_SECONDS=240
          echo "Acquiring shared VPS production lock ($LOCK_PATH, waiting up to ${LOCK_WAIT_SECONDS}s)..."
          exec 9>"$LOCK_PATH"
          if ! flock -w "$LOCK_WAIT_SECONDS" 9; then
            echo "Could not acquire the shared VPS production lock within ${LOCK_WAIT_SECONDS}s -- another deploy or maintenance run is holding it. Refusing to make any Docker state changes." >&2
            exit 1
          fi
          echo "Lock acquired (pid $$). Everything below runs inside the critical section; the lock releases automatically when this script exits."

          echo "================ BEFORE CLEANUP ================"
          echo "--- df -h ---"
          df -h
          echo ""
          echo "--- docker system df ---"
          docker system df
          echo ""
          echo "--- docker builder du ---"
          docker builder du

          echo ""
          echo "================ TAGGED DEPLOYMENT IMAGE RETENTION (mode: ${RETENTION_MODE}) ================"
          echo "CURRENT/PREVIOUS are computed here, AFTER the lock above was acquired -- not before --"
          echo "so the snapshot retention.sh reasons about can't be invalidated by a deploy that starts"
          echo "mid-computation (that deploy would itself be blocked on the same lock)."
          if [ "$RETENTION_MODE" = "apply" ]; then
            CONFIRM=DELETE-PRODUCTION-IMAGES /tmp/poker-production-retention.sh --apply
          else
            /tmp/poker-production-retention.sh --dry-run
          fi
          rm -f /tmp/poker-production-retention.sh

          echo ""
          echo "================ EXISTING CLEANUP (BuildKit / dangling / journal / npm) ================"

          echo "-- docker builder prune: BuildKit cache older than 72h (3 days) --"
          docker builder prune -f --filter "until=72h"

          echo "-- docker image prune: dangling (untagged) images only --"
          docker image prune -f

          echo "-- journalctl --vacuum-time=14d: trim systemd journal to last 14 days --"
          journalctl --vacuum-time=14d

          echo "-- npm cache clean: host-level npm package cache (best-effort) --"
          npm cache clean --force || true

          echo ""
          echo "================ AFTER CLEANUP ================"
          echo "--- df -h ---"
          df -h
          echo ""
          echo "--- docker system df ---"
          docker system df
          echo ""
          echo "--- docker builder du ---"
          docker builder du

          echo ""
          echo "================ APP STILL HEALTHY? ================"
          CONTAINER_ID="$(docker compose -f /opt/reraise/docker-compose.yml ps -q app)"
          if [ -z "$CONTAINER_ID" ]; then
            echo "re-raise app container not found after maintenance." >&2
            exit 1
          fi

          STATUS="$(docker inspect "$CONTAINER_ID" --format '{{.State.Status}}')"
          HEALTH="$(docker inspect "$CONTAINER_ID" --format '{{.State.Health.Status}}')"
          echo "Container status: $STATUS, health: $HEALTH"
          if [ "$STATUS" != "running" ] || [ "$HEALTH" != "healthy" ]; then
            echo "re-raise app is not running+healthy after maintenance." >&2
            exit 1
          fi

          echo "GET https://re-raise.ru/api/health"
          curl --fail --silent --show-error https://re-raise.ru/api/health
          echo ""

          echo "Maintenance complete — app confirmed running and healthy. Lock will now be released (process exit)."
          REMOTE_SCRIPT
