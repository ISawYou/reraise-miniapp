name: "Ops: CRAZY PINEAPPLE (2026-09-13) TO_OXIN attendance one-row fix"

# One-time, narrowly-scoped incident correction -- NOT a general tool.
#
# Confirmed production state (diagnostic run 34779908213, re-verified live by
# this workflow's own DRY_RUN/APPLY guards before any write): the live
# (status='open', non-completed) CRAZY PINEAPPLE tournament
# (18bcea75-d8fe-4d0d-85f5-67320905cfab) has TO_OXIN
# (47886f41-4ca9-4fbc-9836-8fa2cdc7a6cf) with an erroneous
# tournament_attendance row (arrived=true), no registration row, no
# elimination row and no result for this tournament -- the operator has
# confirmed TO_OXIN and the already-eliminated TOXIN
# (53d02f1e-9a94-4dee-ada5-906b7c85038d, place ~8) are the same real person,
# and the active TO_OXIN participation is a duplicate that must not exist in
# this tournament.
#
# lib/tournament-placement.ts::computeDerivedEliminationPlaces derives every
# public place as (field_size - index_in_elimination_order); field_size is
# count(tournament_attendance.arrived = true) for this tournament
# (features/tournaments.ts::getDerivedEliminationPlaces). Removing TO_OXIN
# from the field (not deleting the row -- see below) drops field_size from
# 20 to 19 and every already-eliminated player's derived place shifts down
# by exactly one automatically, with NO stored place value anywhere to
# rewrite. Independently recomputing this from the diagnostic's raw rows
# reproduces the operator's expected final 1..19 ladder exactly.
#
# The write is a single UPDATE (not DELETE): the application itself never
# deletes tournament_attendance rows -- setTournamentPlayerAttendance
# (features/tournaments.ts, used by the admin "Пришёл" checkbox and the
# Google Sheet pull) only ever upserts arrived true/false, and
# getDerivedEliminationPlaces already filters on `.arrived`, so arrived=false
# is the exact, existing, reversible "this player is not in this tournament"
# signal -- not a new deletion pathway.
#
# Touches ONLY tournament_attendance, ONLY this one (tournament_id,
# player_id) row. Does not touch players, registrations,
# tournament_player_eliminations, results, rating, or any other tournament.
# Does not complete the tournament. Does not call Poker Clock.
#
# Delete this workflow file once the correction has been applied and
# verified.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: DRY_RUN performs zero writes. APPLY requires the exact confirmation phrase.
        required: true
        type: choice
        options:
          - DRY_RUN
          - APPLY
        default: DRY_RUN
      confirmation:
        description: For APPLY only, type FIX_CRAZY_PINEAPPLE_TOOXIN exactly. Ignored for DRY_RUN.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual request
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          case "$MODE" in
            DRY_RUN|APPLY) ;;
            *) echo "mode must be DRY_RUN or APPLY." >&2; exit 1 ;;
          esac
          if [ "$MODE" = "APPLY" ] && [ "$CONFIRMATION" != "FIX_CRAZY_PINEAPPLE_TOOXIN" ]; then
            echo "Confirmation did not match FIX_CRAZY_PINEAPPLE_TOOXIN. Production was not contacted." >&2
            exit 1
          fi

  fix:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: ${{ inputs.mode }}
    steps:
      - name: Configure SSH
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Read-only re-verify, then (APPLY only) apply the guarded one-row attendance fix
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.VPS_SSH_PORT || 22 }}" \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=6 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            env FIX_MODE="$MODE" \
            bash -s <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          umask 077

          DB_CONTAINER=poker-clock-db
          DB_NAME=reraise
          DB_USER=reraise
          DOCKER_NETWORK=poker-clock_default
          MODE="${FIX_MODE:-DRY_RUN}"

          # Hardcoded to THIS incident on purpose -- not workflow inputs.
          # Parameterizing tournament/player identification would be the
          # generic "remove any participant" tool this incident does not
          # authorize.
          TOURNAMENT_ID='18bcea75-d8fe-4d0d-85f5-67320905cfab'
          CORRECT_PLAYER_ID='53d02f1e-9a94-4dee-ada5-906b7c85038d'      # TOXIN, must stay untouched
          ERRONEOUS_PLAYER_ID='47886f41-4ca9-4fbc-9836-8fa2cdc7a6cf'   # TO_OXIN, the only row this workflow may write

          section() {
            printf '\n================ %s ================\n' "$1"
          }

          fail() {
            echo "STOP: $*" >&2
            exit 1
          }

          require_healthy_container() {
            local container="$1"
            local status health
            docker inspect "$container" >/dev/null 2>&1 || fail "Required container '$container' was not found."
            status="$(docker inspect "$container" --format '{{.State.Status}}')"
            health="$(docker inspect "$container" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}')"
            [ "$status" = "running" ] && [ "$health" = "healthy" ] \
              || fail "Container '$container' is not healthy (status=$status, health=$health)."
          }

          psql_x() {
            docker exec -i "$DB_CONTAINER" \
              psql -X -q -v ON_ERROR_STOP=1 -U "$DB_USER" -d "$DB_NAME" "$@"
          }

          section "PREFLIGHT"
          require_healthy_container "$DB_CONTAINER"
          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 \
            || fail "Docker network '$DOCKER_NETWORK' was not found."
          docker inspect "$DB_CONTAINER" --format '{{json .NetworkSettings.Networks}}' | grep -q "\"$DOCKER_NETWORK\"" \
            || fail "Container '$DB_CONTAINER' is not connected to '$DOCKER_NETWORK'."

          connected_target="$(psql_x -At <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT current_user || '|' || current_database();
          ROLLBACK;
          SQL
          )"
          [ "$connected_target" = "${DB_USER}|${DB_NAME}" ] \
            || fail "psql connected to an unexpected database or user."

          section "GUARD 1: tournament status"
          tstatus="$(psql_x -At -v tid="$TOURNAMENT_ID" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT status FROM tournaments WHERE id = :'tid'::uuid;
          ROLLBACK;
          SQL
          )"
          echo "tournament_status=$tstatus"
          [ "$tstatus" = "open" ] \
            || fail "Refusing: tournament status is '$tstatus', expected 'open'. Tournament must remain non-completed and match the diagnosed state."

          section "GUARD 2: TO_OXIN erroneous participation (must be attendance-only)"
          erroneous_row="$(psql_x -At -F'|' -v tid="$TOURNAMENT_ID" -v pid="$ERRONEOUS_PLAYER_ID" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT
            (SELECT count(*) FROM registrations WHERE tournament_id = :'tid'::uuid AND player_id = :'pid'::uuid),
            (SELECT count(*) FROM tournament_attendance WHERE tournament_id = :'tid'::uuid AND player_id = :'pid'::uuid AND arrived = true),
            (SELECT count(*) FROM tournament_player_eliminations WHERE tournament_id = :'tid'::uuid AND player_id = :'pid'::uuid AND eliminated = true),
            (SELECT count(*) FROM results WHERE tournament_id = :'tid'::uuid AND player_id = :'pid'::uuid);
          ROLLBACK;
          SQL
          )"
          IFS='|' read -r ERR_REG_COUNT ERR_ATT_ARRIVED_COUNT ERR_ELIM_COUNT ERR_RESULT_COUNT <<EOF
          $erroneous_row
          EOF
          echo "erroneous_registration_count=$ERR_REG_COUNT erroneous_attendance_arrived_true=$ERR_ATT_ARRIVED_COUNT erroneous_elimination_true=$ERR_ELIM_COUNT erroneous_result_count=$ERR_RESULT_COUNT"
          [ "$ERR_REG_COUNT" = "0" ] || fail "Refusing: TO_OXIN now has a registration row for this tournament -- diagnosed state has changed, re-diagnose before proceeding."
          [ "$ERR_ATT_ARRIVED_COUNT" = "1" ] || fail "Refusing: TO_OXIN's attendance row is not arrived=true (count=$ERR_ATT_ARRIVED_COUNT) -- nothing to fix, or state already changed."
          [ "$ERR_ELIM_COUNT" = "0" ] || fail "Refusing: TO_OXIN now has an elimination row -- diagnosed state has changed, re-diagnose before proceeding."
          [ "$ERR_RESULT_COUNT" = "0" ] || fail "Refusing: TO_OXIN now has a result row for this tournament -- diagnosed state has changed, re-diagnose before proceeding."

          section "GUARD 3: TOXIN (correct participant) still present and eliminated, unchanged"
          correct_row="$(psql_x -At -F'|' -v tid="$TOURNAMENT_ID" -v pid="$CORRECT_PLAYER_ID" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT
            (SELECT count(*) FROM registrations WHERE tournament_id = :'tid'::uuid AND player_id = :'pid'::uuid AND status = 'registered'),
            (SELECT count(*) FROM tournament_attendance WHERE tournament_id = :'tid'::uuid AND player_id = :'pid'::uuid AND arrived = true),
            (SELECT count(*) FROM tournament_player_eliminations WHERE tournament_id = :'tid'::uuid AND player_id = :'pid'::uuid AND eliminated = true);
          ROLLBACK;
          SQL
          )"
          IFS='|' read -r CORRECT_REG_COUNT CORRECT_ATT_COUNT CORRECT_ELIM_COUNT <<EOF
          $correct_row
          EOF
          echo "correct_registered=$CORRECT_REG_COUNT correct_attendance_arrived_true=$CORRECT_ATT_COUNT correct_eliminated_true=$CORRECT_ELIM_COUNT"
          [ "$CORRECT_REG_COUNT" = "1" ] && [ "$CORRECT_ATT_COUNT" = "1" ] && [ "$CORRECT_ELIM_COUNT" = "1" ] \
            || fail "Refusing: TOXIN's own registered/attended/eliminated state is not exactly as diagnosed -- re-diagnose before proceeding."

          section "GUARD 4: overall counts still match diagnostic run 34779908213"
          overall_counts="$(psql_x -At -F'|' -v tid="$TOURNAMENT_ID" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT
            (SELECT count(*) FROM tournament_attendance WHERE tournament_id = :'tid'::uuid AND arrived = true),
            (SELECT count(*) FROM tournament_player_eliminations WHERE tournament_id = :'tid'::uuid AND eliminated = true),
            (SELECT count(*) FROM results WHERE tournament_id = :'tid'::uuid);
          ROLLBACK;
          SQL
          )"
          IFS='|' read -r FIELD_SIZE_BEFORE ELIM_TRUE_BEFORE RESULTS_BEFORE <<EOF
          $overall_counts
          EOF
          echo "field_size_before=$FIELD_SIZE_BEFORE eliminated_true_before=$ELIM_TRUE_BEFORE results_before=$RESULTS_BEFORE"
          [ "$FIELD_SIZE_BEFORE" = "20" ] && [ "$ELIM_TRUE_BEFORE" = "19" ] && [ "$RESULTS_BEFORE" = "0" ] \
            || fail "Refusing: overall counts (field_size=$FIELD_SIZE_BEFORE, eliminated=$ELIM_TRUE_BEFORE, results=$RESULTS_BEFORE) no longer match the diagnosed state (20/19/0) -- re-diagnose before proceeding."

          echo "DRY_RUN_MATCHED_EXPECTATION=YES"
          echo "PROPOSED_SQL: UPDATE tournament_attendance SET arrived = false, updated_at = now() WHERE tournament_id = '${TOURNAMENT_ID}' AND player_id = '${ERRONEOUS_PLAYER_ID}' AND arrived = true;"

          if [ "$MODE" = "DRY_RUN" ]; then
            section "DRY_RUN complete -- zero writes performed."
            exit 0
          fi

          section "APPLY"

          attendance_row_count_before="$(psql_x -At <<SQL
          BEGIN TRANSACTION READ ONLY;
          SELECT count(*) FROM tournament_attendance WHERE tournament_id = '${TOURNAMENT_ID}';
          ROLLBACK;
          SQL
          )"

          # Bash-interpolated (not psql -v) for this DO block specifically --
          # mirrors ops-lee-bounty-ko-fix.yml's proven APPLY pattern exactly
          # (that workflow's DO $$ ... $$ writes ran successfully in this same
          # production environment). All three values are this workflow's own
          # hardcoded constants above, never external input.
          apply_output="$(psql_x -At <<SQL
          BEGIN;

          DO \$\$
          DECLARE
            v_count integer;
            v_erroneous_arrived boolean;
            v_correct_arrived boolean;
            v_correct_eliminated boolean;
            v_correct_eliminated_at timestamptz;
          BEGIN
            UPDATE tournament_attendance
            SET arrived = false, updated_at = now()
            WHERE tournament_id = '${TOURNAMENT_ID}'
              AND player_id = '${ERRONEOUS_PLAYER_ID}'
              AND arrived = true;

            GET DIAGNOSTICS v_count = ROW_COUNT;
            IF v_count <> 1 THEN
              RAISE EXCEPTION 'guard failed: expected exactly 1 attendance row updated for TO_OXIN, got %', v_count;
            END IF;

            SELECT arrived INTO v_erroneous_arrived
            FROM tournament_attendance
            WHERE tournament_id = '${TOURNAMENT_ID}' AND player_id = '${ERRONEOUS_PLAYER_ID}';

            IF v_erroneous_arrived IS DISTINCT FROM false THEN
              RAISE EXCEPTION 'guard failed: TO_OXIN attendance.arrived is % after update, expected false', v_erroneous_arrived;
            END IF;

            SELECT arrived INTO v_correct_arrived
            FROM tournament_attendance
            WHERE tournament_id = '${TOURNAMENT_ID}' AND player_id = '${CORRECT_PLAYER_ID}';
            IF v_correct_arrived IS DISTINCT FROM true THEN
              RAISE EXCEPTION 'guard failed: TOXIN attendance.arrived changed to % -- must remain true', v_correct_arrived;
            END IF;

            SELECT eliminated, eliminated_at INTO v_correct_eliminated, v_correct_eliminated_at
            FROM tournament_player_eliminations
            WHERE tournament_id = '${TOURNAMENT_ID}' AND player_id = '${CORRECT_PLAYER_ID}';
            IF v_correct_eliminated IS DISTINCT FROM true OR v_correct_eliminated_at IS DISTINCT FROM TIMESTAMPTZ '2026-09-13 18:20:37.212+00' THEN
              RAISE EXCEPTION 'guard failed: TOXIN elimination row changed (eliminated=%, eliminated_at=%) -- must remain exactly as diagnosed', v_correct_eliminated, v_correct_eliminated_at;
            END IF;

            IF EXISTS (SELECT 1 FROM registrations WHERE tournament_id = '${TOURNAMENT_ID}' AND player_id = '${ERRONEOUS_PLAYER_ID}') THEN
              RAISE EXCEPTION 'guard failed: a registrations row for TO_OXIN now exists -- this workflow must never touch registrations';
            END IF;

            IF EXISTS (SELECT 1 FROM tournament_player_eliminations WHERE tournament_id = '${TOURNAMENT_ID}' AND player_id = '${ERRONEOUS_PLAYER_ID}') THEN
              RAISE EXCEPTION 'guard failed: an elimination row for TO_OXIN now exists -- this workflow must never create one';
            END IF;
          END
          \$\$;

          SELECT player_id, arrived, arrived_at FROM tournament_attendance
          WHERE tournament_id = '${TOURNAMENT_ID}' AND player_id IN ('${ERRONEOUS_PLAYER_ID}', '${CORRECT_PLAYER_ID}')
          ORDER BY player_id;

          COMMIT;
          SQL
          )"

          attendance_row_count_after="$(psql_x -At -v tid="$TOURNAMENT_ID" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT count(*) FROM tournament_attendance WHERE tournament_id = :'tid'::uuid;
          ROLLBACK;
          SQL
          )"
          [ "$attendance_row_count_before" = "$attendance_row_count_after" ] \
            || fail "tournament_attendance row COUNT for this tournament changed ($attendance_row_count_before -> $attendance_row_count_after) -- this must never happen for a single arrived-flag UPDATE."

          echo "AFFECTED_ROWS=1"
          echo "$apply_output"

          section "POST-WRITE OVERALL COUNTS"
          post_counts="$(psql_x -At -F'|' -v tid="$TOURNAMENT_ID" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT
            (SELECT count(*) FROM tournament_attendance WHERE tournament_id = :'tid'::uuid) AS attendance_rows_total,
            (SELECT count(*) FROM tournament_attendance WHERE tournament_id = :'tid'::uuid AND arrived = true) AS attendance_arrived_true,
            (SELECT count(*) FROM tournament_player_eliminations WHERE tournament_id = :'tid'::uuid AND eliminated = true) AS elimination_eliminated_true,
            (SELECT count(*) FROM tournament_attendance att WHERE att.tournament_id = :'tid'::uuid AND att.arrived = true
               AND NOT EXISTS (SELECT 1 FROM tournament_player_eliminations el WHERE el.tournament_id = att.tournament_id AND el.player_id = att.player_id AND el.eliminated = true)
            ) AS active_players_after,
            (SELECT status FROM tournaments WHERE id = :'tid'::uuid) AS tournament_status_after;
          ROLLBACK;
          SQL
          )"
          echo "$post_counts"

          section "POST-WRITE DERIVED PLACE LADDER (recomputed exactly per lib/tournament-placement.ts::computeDerivedEliminationPlaces)"
          field_size_after="$(psql_x -At -v tid="$TOURNAMENT_ID" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT count(*) FROM tournament_attendance WHERE tournament_id = :'tid'::uuid AND arrived = true;
          ROLLBACK;
          SQL
          )"
          echo "field_size_after=$field_size_after"
          after_ladder="$(psql_x -At -F'|' -v tid="$TOURNAMENT_ID" <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SELECT p.display_name, el.eliminated_at
          FROM tournament_attendance att
          JOIN players p ON p.id = att.player_id
          JOIN tournament_player_eliminations el ON el.player_id = att.player_id AND el.tournament_id = att.tournament_id
          WHERE att.tournament_id = :'tid'::uuid AND att.arrived = true AND el.eliminated = true
          ORDER BY el.eliminated_at ASC, att.player_id ASC;
          ROLLBACK;
          SQL
          )"
          echo "$after_ladder" | awk -F'|' -v fs="$field_size_after" '{ idx++; printf "PLACE %d: %s (eliminated_at=%s)\n", fs-(idx-1), $1, $2 }'

          section "APPLY complete and committed. Tournament remains non-completed; no rating/results changed; no other tournament touched."
          REMOTE_SCRIPT
